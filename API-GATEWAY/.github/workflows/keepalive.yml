name: Keep Services Warm

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:          # Manual trigger too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Gateway
        run: |
          curl -f https://flowmetrics-gateway.onrender.com/health || true