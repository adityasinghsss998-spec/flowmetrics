name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  deployments: write
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Deployment
        id: create_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating deployment for commit ${{ github.sha }} on environment production..."
          DEPLOYMENT_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments \
            -f ref="${{ github.sha }}" \
            -f environment="production" \
            -F auto_merge=false \
            -F required_contexts='[]' \
            -f description="Render production deployment" \
            --jq '.id')

          if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "null" ]; then
            echo "Error: Failed to create deployment"
            exit 1
          fi

          echo "Created deployment ID: $DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Build duration delay
        run: |
          # Brief delay so completed_at - deployed_at produces a measurable build duration
          sleep 10

      - name: Mark Deployment as Successful
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Marking deployment ${{ steps.create_deployment.outputs.deployment_id }} as success..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -f state="success" \
            -f environment="production" \
            -f description="Render production deployment succeeded"

      - name: Mark Deployment as Failed
        if: failure() && steps.create_deployment.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Marking deployment ${{ steps.create_deployment.outputs.deployment_id }} as failure..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -f state="failure" \
            -f environment="production" \
            -f description="Render production deployment failed"
